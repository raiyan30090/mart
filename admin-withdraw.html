<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - উইথড্র ম্যানেজমেন্ট</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .page-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .back-btn { display: inline-block; margin-bottom: 15px; color: #047857; font-weight: bold; text-decoration: none; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #e5e7eb; padding: 12px; text-align: left; vertical-align: middle; }
        th { background: #1f2937; color: white; }
        
        /* Status Select Dropdown inside Table */
        .status-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-weight: bold;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        
        .clear-btn { background: #dc2626; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; float: right; }
        .clear-btn:hover { background: #b91c1c; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরুন</a>

        <div class="page-card">
            <h2><i class="fa-solid fa-user-shield" style="color: #047857;"></i> অ্যাডমিন প্যানেল: রিসেলার উইথড্র ম্যানেজমেন্ট</h2>
            <p style="font-size: 13px; color: #6b7280; margin-bottom: 15px;">এখান থেকে রিসেলারদের উইথড্র রিকোয়েস্টগুলোর স্ট্যাটাস পরিবর্তন করতে পারবেন।</p>
            
            <button class="clear-btn" onclick="clearAllHistory()"><i class="fa-solid fa-trash"></i> সব হিস্ট্রি মুছুন</button>
            <div style="clear: both;"></div>

            <table>
                <thead>
                    <tr>
                        <th>তারিখ</th>
                        <th>Reseller ID</th>
                        <th>মেথড ও নম্বর</th>
                        <th>পরিমাণ</th>
                        <th>বর্তমান স্ট্যাটাস ও পরিবর্তন করুন</th>
                    </tr>
                </thead>
                <tbody id="admin-withdraw-body">
                    <!-- JavaScript দিয়ে ডায়নামিকভাবে লোড হবে -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminWithdraws();
        });

        // অ্যাডমিন প্যানেলে টেবিল লোড করা
        function loadAdminWithdraws() {
            const tbody = document.getElementById('admin-withdraw-body');
            let history = JSON.parse(localStorage.getItem('withdrawHistory')) || [];

            if (history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #6b7280;">কোনো উইথড্র রিকোয়েস্ট পাওয়া যায়নি।</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            history.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.date}</td>
                        <td><b>${item.resellerid || 'N/A'}</b></td>
                        <td>${item.method}<br><small style="color:#6b7280">${item.number}</small></td>
                        <td><b>৳ ${item.amount}</b></td>
                        <td>
                            <select class="status-select" onchange="updateStatus(${index}, this.value)">
                                <option value="Waiting for Approved" ${item.status === 'Waiting for Approved' ? 'selected' : ''}>⏳ Waiting for Approved</option>
                                <option value="Pending" ${item.status === 'Pending' ? 'selected' : ''}>🔄 Pending</option>
                                <option value="Ready for Payment" ${item.status === 'Ready for Payment' ? 'selected' : ''}>📦 Ready for Payment</option>
                                <option value="Payment Successful" ${item.status === 'Payment Successful' ? 'selected' : ''}>✅ Payment Successful</option>
                            </select>
                        </td>
                    </tr>
                `;
            });
        }

        // স্ট্যাটাস পরিবর্তন করে LocalStorage-এ আপডেট করা
        function updateStatus(index, newStatus) {
            let history = JSON.parse(localStorage.getItem('withdrawHistory')) || [];
            if(history[index]) {
                history[index].status = newStatus;
                localStorage.setItem('withdrawHistory', JSON.stringify(history));
                alert(`✅ স্ট্যাটাস সফলভাবে পরিবর্তন করে "${newStatus}" করা হয়েছে!`);
                loadAdminWithdraws(); // টেবিল রিফ্রেশ
            }
        }

        // সব হিস্ট্রি ক্লিয়ার করার ফাংশন
        function clearAllHistory() {
            if(confirm('আপনি কি নিশ্চিতভাবে সব উইথড্র হিস্ট্রি মুছে ফেলতে চান?')) {
                localStorage.removeItem('withdrawHistory');
                loadAdminWithdraws();
            }
        }
    </script>

</body>
</html>
