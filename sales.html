<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সেলস ওভারভিউ - Mart Express BD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; padding: 20px; }
        .page-card { background: white; padding: 20px; border-radius: 12px; }
        .back-btn { display: inline-block; margin-bottom: 15px; color: #047857; font-weight: bold; text-decoration: none; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .stat-box { background: #eff6ff; padding: 15px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরুন</a>
    <div class="page-card">
        <h2><i class="fa-solid fa-chart-line" style="color: #3b82f6;"></i> সেলস ওভারভিউ</h2>
        <div class="stat-grid">
            <div class="stat-box"><b>মোট অর্ডার</b><br>12 টি</div>
            <div class="stat-box"><b>মোট সেলস</b><br>৳ 18,500</div>
        </div>
    </div>
</body>
</html>
