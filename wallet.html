<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়ালেট - Mart Express BD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; padding: 20px; }
        .page-card { background: white; padding: 20px; border-radius: 12px; text-align: center; }
        .back-btn { display: inline-block; margin-bottom: 15px; color: #047857; font-weight: bold; text-decoration: none; }
        .balance-card { background: #047857; color: white; padding: 20px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরুন</a>
    <div class="page-card">
        <h2><i class="fa-solid fa-wallet" style="color: #14b8a6;"></i> আপনার ওয়ালেট</h2>
        <div class="balance-card">
            <p>বর্তমান ব্যালেন্স</p>
            <h1 id="walletBalance">৳ 0.00</h1>
        </div>
    </div>
    <script>
    // ইউজারের ডাটা এবং অ্যাডমিন প্যানেলের ব্যালেন্স সিঙ্ক করার কোড
    function loadWalletBalance() {
      const user = JSON.parse(localStorage.getItem('user')) || JSON.parse(localStorage.getItem('loggedReseller')) || JSON.parse(localStorage.getItem('currentReseller'));
      if(!user) return;

      let userPhone = user.phone || user.mobile || user.resellerId;
      let resellers = JSON.parse(localStorage.getItem('resellerBalances')) || [];
      let currentReseller = resellers.find(r => r.phone === userPhone || r.mobile === userPhone || r.id === userPhone);

      let balanceEl = document.getElementById('walletBalance');
      if(currentReseller && balanceEl) {
        balanceEl.innerText = `৳ ${parseFloat(currentReseller.balance).toFixed(2)}`;
      } else if(user && user.balance !== undefined && balanceEl) {
        balanceEl.innerText = `৳ ${parseFloat(user.balance).toFixed(2)}`;
      }
    }

    loadWalletBalance();
    setInterval(loadWalletBalance, 2000);
  </script>
</body>
</html>
