<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পেমেন্ট ও অর্ডার কনফার্মেশন - Mart Express BD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; padding: 20px; margin: 0; }
        .container { max-width: 550px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #047857; font-weight: bold; text-decoration: none; font-size: 14px; }
        
        .checkout-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 24px;
            border: 1px solid #e5e7eb;
        }
        .checkout-title {
            font-size: 18px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 12px;
        }

        .product-summary {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .p-name { font-weight: 600; font-size: 14px; color: #374151; }
        .p-price { font-weight: bold; color: #dc2626; font-size: 15px; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 6px; }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #047857; box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.1); }

        /* Payment Gateway Options Grid */
        .payment-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .payment-card {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: #374151;
            transition: all 0.2s;
            background: #fafafa;
        }
        .payment-card.active {
            border-color: #047857;
            background: #f0fdf4;
            color: #047857;
        }

        /* Payment Instructions Box */
        .gateway-instructions {
            background: #fffbeb;
            border: 1px solid #fef3c7;
            padding: 14px;
            border-radius: 8px;
            font-size: 13px;
            color: #92400e;
            margin-bottom: 16px;
            display: none;
        }

        .btn-submit {
            background: #047857;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #065f46; }
    </style>
</head>
<body>

    <div class="container">
        <a href="all-products.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> প্রোডাক্ট লিস্টে ফিরুন</a>
        
        <div class="checkout-card">
            <div class="checkout-title">
                <i class="fa-solid fa-credit-card" style="color: #047857;"></i> পেমেন্ট ও অর্ডার কনফার্মেশন
            </div>

            <!-- Product Info -->
            <div class="product-summary" id="productSummaryBox">
                <div>
                    <div style="font-size: 11px; color: #6b7280;">নির্বাচিত পণ্য:</div>
                    <div class="p-name" id="displayName">লোড হচ্ছে...</div>
                </div>
                <div class="p-price" id="displayPrice">৳ 0</div>
            </div>

            <form onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label class="form-label">আপনার নাম</label>
                    <input type="text" class="form-control" id="customerName" placeholder="সম্পূর্ণ নাম লিখুন" required>
                </div>

                <div class="form-group">
                    <label class="form-label">মোবাইল নাম্বার</label>
                    <input type="tel" class="form-control" id="customerPhone" placeholder="01XXXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label class="form-label">ডেলিভারি ঠিকানা</label>
                    <textarea class="form-control" id="customerAddress" rows="2" placeholder="বাসা/রোড, থানা, জেলা..." required></textarea>
                </div>

                <!-- Payment Method Selection -->
                <div class="form-group">
                    <label class="form-label">পেমেন্ট মেথড সিলেক্ট করুন</label>
                    <div class="payment-options">
                        <div class="payment-card" id="bkashCard" onclick="selectPayment('bkash')">
                            <i class="fa-solid fa-wallet"></i> বিকাশ (bKash)
                        </div>
                        <div class="payment-card" id="nagadCard" onclick="selectPayment('nagad')">
                            <i class="fa-solid fa-wallet"></i> নগদ (Nagad)
                        </div>
                        <div class="payment-card" id="rocketCard" onclick="selectPayment('rocket')">
                            <i class="fa-solid fa-wallet"></i> রকেট (Rocket)
                        </div>
                        <div class="payment-card" id="upayCard" onclick="selectPayment('upay')">
                            <i class="fa-solid fa-wallet"></i> উপায় (Upay)
                        </div>
                    </div>
                </div>

                <!-- Gateway instruction box with account numbers and notes -->
                <div class="gateway-instructions" id="instructionBox">
                    <div id="accountDetailsText" style="margin-bottom: 8px; font-weight: bold;"></div>
                    <div style="font-size: 12px; margin-bottom: 10px; color: #b45309;">
                        নোট: নিচের যেকোনো একটি পেমেন্ট অ্যাকাউন্টে সেন্ড মানি করে পেমেন্ট করার নম্বর এবং ট্রানজেকশন আইডি দিন।
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <input type="text" class="form-control" id="senderNumber" placeholder="যে নাম্বার থেকে টাকা পাঠিয়েছেন (যেমন: 01XXXXXXXXX)" style="background: white;" required>
                        <input type="text" class="form-control" id="trxIdInput" placeholder="ট্রানজেকশন আইডি (TrxID) দিন" style="background: white;" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">পেমেন্ট সম্পন্ন করে অর্ডার কনফার্ম করুন</button>
            </form>
        </div>
    </div>

    <script>
        let selectedMethod = '';

        window.onload = function() {
            let checkoutItem = JSON.parse(localStorage.getItem('checkoutItem'));
            if(checkoutItem) {
                document.getElementById('displayName').innerText = checkoutItem.name;
                document.getElementById('displayPrice').innerText = '৳ ' + checkoutItem.price;
            } else {
                document.getElementById('productSummaryBox').innerHTML = '<span style="color: #dc2626; font-size: 13px;">কোনো পণ্য সিলেক্ট করা হয়নি!</span>';
            }
        }

        function selectPayment(method) {
            selectedMethod = method;
            
            // Cards selection highlight toggle
            let cards = ['bkashCard', 'nagadCard', 'rocketCard', 'upayCard'];
            cards.forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
            document.getElementById(method + 'Card').classList.add('active');

            // Show instruction box
            let instructionBox = document.getElementById('instructionBox');
            let accountText = document.getElementById('accountDetailsText');
            instructionBox.style.display = 'block';

            // Set specific merchant numbers
            if(method === 'bkash') {
                accountText.innerHTML = '📌 বিকাশ মার্চেন্ট/পার্সোনাল নাম্বার: <span style="color: #be123c;">01716292744</span>';
            } else if(method === 'nagad') {
                accountText.innerHTML = '📌 নগদ মার্চেন্ট/পার্সোনাল নাম্বার: <span style="color: #be123c;">01716292744</span>';
            } else if(method === 'rocket') {
                accountText.innerHTML = '📌 রকেট অ্যাকাউন্ট নাম্বার: <span style="color: #be123c;">01716292744-5</span>';
            } else if(method === 'upay') {
                accountText.innerHTML = '📌 উপায় অ্যাকাউন্ট নাম্বার: <span style="color: #be123c;">01716292744</span>';
            }
        }

        function submitOrder(event) {
            event.preventDefault();

            if (!selectedMethod) {
                alert('⚠️ দয়া করে যেকোনো একটি পেমেন্ট মেথড (বিকাশ, নগদ, রকেট বা উপায়) সিলেক্ট করুন!');
                return;
            }

            let senderNum = document.getElementById('senderNumber').value.trim();
            let trxId = document.getElementById('trxIdInput').value.trim();

            if (senderNum === '' || trxId === '') {
                alert('⚠️ পেমেন্ট সম্পন্ন হয়নি! পেমেন্ট করা আপনার মোবাইল নাম্বার এবং ট্রানজেকশন আইডি (TrxID) সঠিকভাবে পূরণ করুন।');
                return;
            }

            let name = document.getElementById('customerName').value;
            alert('ধন্যবাদ ' + name + '! আপনার পেমেন্ট এবং অর্ডারটি সফলভাবে কনফার্ম হয়েছে।');
            localStorage.removeItem('checkoutItem');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
