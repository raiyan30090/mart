<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Mart Express BD</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-box { max-width: 500px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .step { display: none; }
        .step.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .payment-option { border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; }
        .payment-option input { margin-right: 10px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo-container">
            <div class="logo-icon">M</div>
            <div class="logo-text">Mart Express <span>BD</span></div>
        </a>
    </nav>

    <div class="container">
        <div class="checkout-box">
            
            <!-- Step 1: Order Form -->
            <div id="step-shipping" class="step active">
                <h2>📦 Order Information</h2>
                <hr style="margin: 15px 0;">
                <form id="shipping-form">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" id="cust-name" required placeholder="Enter full name">
                    </div>
                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="tel" id="cust-phone" required placeholder="017XXXXXXXX">
                    </div>
                    <div class="form-group">
                        <label>Delivery Address</label>
                        <input type="text" id="cust-address" required placeholder="Full address">
                    </div>
                    <button type="button" class="btn-buy" onclick="goToPayment()">Proceed to Payment</button>
                </form>
            </div>

            <!-- Step 2: Payment Page -->
            <div id="step-payment" class="step">
                <h2>💳 Payment Method</h2>
                <hr style="margin: 15px 0;">
                <div class="payment-option">
                    <label><input type="radio" name="payment" value="COD" checked> Cash on Delivery</label>
                </div>
                <div class="payment-option">
                    <label><input type="radio" name="payment" value="bKash"> bKash Online Payment</label>
                </div>
                <button type="button" class="btn-buy" style="margin-top: 15px;" onclick="confirmOrder()">Confirm Order</button>
                <button type="button" onclick="goToShipping()" style="background: none; border: none; color: #666; margin-top: 10px; cursor: pointer; width: 100%;">← Back to Order Form</button>
            </div>

            <!-- Step 3: Confirmation -->
            <div id="step-success" class="step" style="text-align: center;">
                <h1 style="font-size: 50px;">🎉</h1>
                <h2 style="color: #16a34a;">Order Placed Successfully!</h2>
                <p style="margin: 15px 0; color: #555;">Thank you for shopping with Mart Express BD.</p>
                <a href="index.html" class="btn-buy" style="text-decoration: none; display: inline-block;">Back to Home</a>
            </div>

        </div>
    </div>

    <script>
        function goToPayment() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;

            if(!name || !phone || !address) {
                alert('Please fill out all fields.');
                return;
            }

            document.getElementById('step-shipping').classList.remove('active');
            document.getElementById('step-payment').classList.add('active');
        }

        function goToShipping() {
            document.getElementById('step-payment').classList.remove('active');
            document.getElementById('step-shipping').classList.add('active');
        }

        function confirmOrder() {
            document.getElementById('step-payment').classList.remove('active');
            document.getElementById('step-success').classList.add('active');
        }
    </script>
</body>
</html>
