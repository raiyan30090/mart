<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার ও কুরিয়ার ট্র্যাকিং</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'SolaimanLipi', sans-serif; background: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1700px; margin: auto; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { font-size: 20px; color: #1e293b; margin: 0; display: flex; align-items: center; gap: 8px; }
        
        .table-responsive { width: 100%; overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; background: #fff; }
        th, td { border-bottom: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; padding: 12px 15px; text-align: left; font-size: 13px; vertical-align: middle; }
        th:last-child, td:last-child { border-right: none; }
        th { background: #f8fafc; color: #475569; font-weight: 600; }
        
        .badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 11px; display: inline-block; }
        .product-info { display: flex; align-items: center; gap: 10px; }
        .product-img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; }
        
        .customer-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 10px; border-radius: 6px; min-width: 230px; font-size: 12px; line-height: 1.6; }
        .copy-btn { background: none; border: none; color: #2563eb; cursor: pointer; padding: 0; font-size: 11px; float: right; font-weight: bold; }
        .copy-btn:hover { text-decoration: underline; }

        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .status-waiting { background: #fef3c7; color: #d97706; }
        .status-cancel { background: #fee2e2; color: #dc2626; }
        .status-default { background: #e0f2fe; color: #0369a1; }

        .tracking-btn { background: #2563eb; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 5px; }
        .tracking-btn:hover { background: #1d4ed8; }
        
        .tracking-link-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 10px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 220px; }
        .link-text { color: #2563eb; text-decoration: none; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
        .link-text:hover { text-decoration: underline; }
    </style>
</head>
<body onload="loadUserOrders()">

<div class="container">
    <a href="index.html" style="text-decoration:none; font-weight:bold; color:#0f172a; display:inline-block; margin-bottom:15px;"><i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরুন</a>
    
    <div class="card">
        <div class="header-flex">
            <h2><i class="fa-solid fa-truck-fast" style="color: #2563eb;"></i> অর্ডার ও কুরিয়ার ট্র্যাকিং <span id="total-count" style="font-size: 14px; color: #64748b; font-weight: normal; margin-left: 5px;"></span></h2>
        </div>
        
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>তারিখ ও সময়</th>
                        <th>অর্ডার ও প্রোডাক্ট</th>
                        <th>কাস্টমার তথ্য</th>
                        <th>রিসেলার আইডি</th>
                        <th>অ্যাকশন</th>
                        <th>ট্র্যাকিং লিংক</th>
                    </tr>
                </thead>
                <tbody id="user-orders-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function copyText(text) {
        navigator.clipboard.writeText(text).then(function() {
            alert('সফলভাবে কপি হয়েছে: ' + text);
        });
    }

    function loadUserOrders() {
        var orders = JSON.parse(localStorage.getItem('myOrders')) || [];
        
        if(orders.length === 0) {
            orders = [
                { 
                    dateTime: 'Aug 27, 2026, 06:45 PM', 
                    productName: 'স্মার্টফোন Z1', 
                    productCode: '#MEBD-P1024', 
                    productImage: 'https://via.placeholder.com/40',
                    customerName: 'রহিম উদ্দিন', 
                    customerPhone: '01711223344',
                    customerAddress: 'হাউস নং ৩৮/১, শেকেরটেক রোড ০২',
                    customerThana: 'মোহাম্মদপুর',
                    customerDistrict: 'ঢাকা',
                    resellerId: 'MX-88402', 
                    statusText: 'Waiting for Approved', 
                    courierLink: 'https://martexpressbd.sellbd.shop/' 
                },
                { 
                    dateTime: 'Aug 28, 2026, 11:15 AM', 
                    productName: 'প্রিমিয়াম শাড়ি', 
                    productCode: '#MEBD-P1025', 
                    productImage: 'https://via.placeholder.com/40',
                    customerName: 'ফাতেমা বেগম', 
                    customerPhone: '01339710289',
                    customerAddress: 'স্টেশন রোড, মোক্কা টাওয়ার',
                    customerThana: 'সদর',
                    customerDistrict: 'টাঙ্গাইল',
                    resellerId: 'MX-88402', 
                    statusText: 'Order cancelled', 
                    courierLink: 'https://Steadfast.com.bd/tracking' 
                }
            ];
            localStorage.setItem('myOrders', JSON.stringify(orders));
        }

        document.getElementById('total-count').innerText = '(মোট অর্ডার: ' + orders.length + 'টি)';
        var tbody = document.getElementById('user-orders-body');
        tbody.innerHTML = '';

        for(var i = 0; i < orders.length; i++) {
            var item = orders[i];
            var status = item.statusText || 'Waiting for Approved';
            
            var statusClass = 'status-default';
            if(status === 'Waiting for Approved') statusClass = 'status-waiting';
            else if(status === 'Order cancelled') statusClass = 'status-cancel';

            var tr = document.createElement('tr');
            tr.innerHTML = 
                '<td style="color: #475569;">' + item.dateTime + '</td>' +
                '<td>' +
                    '<div class="product-info">' +
                        '<img src="' + (item.productImage || 'https://via.placeholder.com/40') + '" class="product-img">' +
                        '<div>' +
                            '<div style="font-weight: 600; color: #1e293b;">' + item.productName + '</div>' +
                            '<div style="font-size: 11px; color: #64748b;">Code: ' + item.productCode + '</div>' +
                        '</div>' +
                    '</div>' +
                '</td>' +
                '<td>' +
                    '<div class="customer-box">' +
                        '<div><b>নাম:</b> ' + (item.customerName || 'ন/এ') + '</div>' +
                        '<div><b>ফোন:</b> ' + (item.customerPhone || 'ন/এ') + ' <button class="copy-btn" onclick="copyText(\'' + (item.customerPhone || '') + '\')">কপি</button></div>' +
                        '<div><b>ঠিকানা:</b> ' + (item.customerAddress || 'ন/এ') + '</div>' +
                        '<div><b>থানা/জেলা:</b> ' + (item.customerThana || '') + ', ' + (item.customerDistrict || '') + '</div>' +
                    '</div>' +
                '</td>' +
                '<td><span class="badge">' + item.resellerId + '</span></td>' +
                '<td><span class="status-badge ' + statusClass + '">' + status + '</span></td>' +
                '<td>' + 
                    (item.courierLink ? 
                    '<div><a href="' + item.courierLink + '" target="_blank" class="tracking-btn"><i class="fa-solid fa-location-dot"></i> ট্র্যাকিং দেখুন</a></div>' +
                    '<div class="tracking-link-box">' +
                        '<a href="' + item.courierLink + '" target="_blank" class="link-text">' + item.courierLink + '</a>' +
                        '<button class="copy-btn" style="float:none;" onclick="copyText(\'' + item.courierLink + '\')">কপি</button>' +
                    '</div>' 
                    : '<span style="color:#94a3b8; font-size:12px;">লিংক নেই</span>') + 
                '</td>';
            tbody.appendChild(tr);
        }
    }
</script>
</body>
</html>
