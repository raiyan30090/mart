<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Login / Register - Mart Express BD</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <nav class="navbar">
    <h2>🛒 Mart Express BD</h2>
    <a href="./index.html">Home</a>
  </nav>

  <div class="container">
    <div class="card" style="max-width: 450px; margin: 0 auto;">
      <h3>👨‍💻 Account Registration</h3>
      <form id="regForm" style="margin-top:15px;">
        <label>Name</label>
        <input type="text" id="regName" required>
        <label>Phone Number</label>
        <input type="text" id="regPhone" required>
        <label>Password</label>
        <input type="password" id="regPassword" required>
        <label>Role</label>
        <select id="regRole">
          <option value="CUSTOMER">Customer</option>
          <option value="RESELLER">Reseller</option>
        </select>
        <button type="submit" class="btn" style="margin-top:15px; width:100%;">Register</button>
      </form>
    </div>
  </div>

  <script src="./js/app.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('regName').value,
        phone: document.getElementById('regPhone').value,
        password: document.getElementById('regPassword').value,
        role: document.getElementById('regRole').value
      };
      
      const res = await apiCall('/api/auth/register', 'POST', payload);
      alert(res.message);
      if(res.success && res.data.role === 'RESELLER') {
        localStorage.setItem('user', JSON.stringify(res.data));
        window.location.href = './reseller/reseller-dashboard.html';
      }
    });
  </script>
</body>
</html>
