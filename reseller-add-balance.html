<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Add Balance - Mart Express BD</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar">
    <h2>💳 Add Balance</h2>
    <a href="./reseller-dashboard.html">Dashboard</a>
  </nav>

  <div class="container">
    <div class="card" style="max-width: 500px; margin: 0 auto;">
      <h3>Send Money & Submit TrxID</h3>
      <form id="addBalanceForm" style="margin-top: 15px;">
        <label>Amount (৳)</label>
        <input type="number" id="amount" required>

        <label>Payment Method</label>
        <select id="paymentMethod">
          <option value="BKASH">bKash Personal</option>
          <option value="NAGAD">Nagad Personal</option>
          <option value="ROCKET">Rocket Personal</option>
        </select>

        <label>Transaction ID (TrxID)</label>
        <input type="text" id="gatewayTrxId" placeholder="e.g. 9B7A2K11X" required>

        <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Submit Verification</button>
      </form>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById('addBalanceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = JSON.parse(localStorage.getItem('user'));
      if(!user) return alert('অনুগ্রহ করে লগইন করুন');

      const payload = {
        userId: user._id,
        amount: Number(document.getElementById('amount').value),
        paymentMethod: document.getElementById('paymentMethod').value,
        gatewayTrxId: document.getElementById('gatewayTrxId').value
      };

      const res = await apiCall('/api/wallet/add-balance', 'POST', payload);
      alert(res.message);
    });
  </script>
</body>
</html>
