<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সকল প্রোডাক্ট - Mart Express BD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="app.js" defer></script>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; padding: 20px; }
        .page-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .back-btn { display: inline-block; margin-bottom: 15px; color: #047857; font-weight: bold; text-decoration: none; }
        .product-grid-page { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
        .p-box { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; text-align: center; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরুন</a>
    <div class="page-card">
        <h2><i class="fa-solid fa-box-open" style="color: #047857;"></i> সকল প্রোডাক্ট</h2>
        <div class="product-grid-page">
            <div class="p-box">📱<br><b>স্মার্টফোন Z1</b><br>৳ 14,800</div>
            <div class="p-box">⌚<br><b>স্মার্টওয়াচ Ultra</b><br>৳ 1,250</div>
            <div class="p-box">🎧<br><b>ইয়ারবাড X</b><br>৳ 850</div>
            <div class="p-box">💻<br><b>ল্যাপটপ ব্যাগ</b><br>৳ 990</div>
        </div>
    </div>
</body>
</html>
