<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Mart Express BD</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="navbar" style="background:#1a252f;">
    <h2>⚙️ Admin Panel</h2>
    <a href="../index.html">Shop</a>
  </nav>

  <div class="container">
    <div class="card">
      <h3>📋 Pending Payment Requests</h3>
      <table>
        <thead>
          <tr>
            <th>Reseller</th>
            <th>Method</th>
            <th>TrxID</th>
            <th>Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="pendingTable">
          <!-- Dynamic Data -->
        </tbody>
      </table>
    </div>
  </div>

 <script src="../js/app.js"></script>
<script>
  async function loadPending() {
    const res = await apiCall('/api/wallet/admin/pending');
    const table = document.getElementById('pendingTable');
    table.innerHTML = '';

    if (res.success) {
      res.data.forEach(item => {
        table.innerHTML += `
          <tr>
            <td>${item.user?.name || 'User'} (${item.user?.resellerId || ''})</td>
            <td>${item.paymentMethod}</td>
            <td><b>${item.gatewayTrxId}</b></td>
            <td>Tk ${item.amount}</td>
            <td>
              <button class="btn btn-success" onclick="approve('${item._id}')">Approve</button>
            </td>
          </tr>
        `;
      });
    }
  }

  async function approve(id) {
    const res = await apiCall('/api/wallet/admin/approve', 'POST', { transactionId: id });
    alert(res.message);
    loadPending();
  }

  loadPending();
</script>
  </script>
</body>
</html>
